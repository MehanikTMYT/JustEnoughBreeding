plugins {
    // see https://plugins.gradle.org/plugin/org.jetbrains.gradle.plugin.idea-ext for new versions
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.4.1"
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

subprojects {
    repositories {
        // синк/порт 26.1.2: репозиторий ModMaven удалена — политика EMI-only (просмотрщик EMI)
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
        // синк/порт 26.1.2: maven.shedaniel.me удалена — больше нет REI/cloth-зависимостей
        maven { url "https://maven.architectury.dev/" }
        maven {
            name = "TerraformersMC" //EMI
            url = "https://maven.terraformersmc.com/"
        }
    }

}